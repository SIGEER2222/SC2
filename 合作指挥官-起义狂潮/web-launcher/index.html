<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>7vs1 Coop Launcher</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>7vs1 Coop Launcher</h1>
        <div id="dataStatus" class="subtle">加载中</div>
      </div>
      <div class="top-actions">
        <div class="action-group config-action-group" aria-label="配置操作">
          <span>配置</span>
          <button id="refreshButton" type="button" class="secondary">刷新</button>
          <button id="saveConfigButton" type="button" class="secondary" disabled>保存配置</button>
          <button id="resetConfigButton" type="button" class="secondary" disabled>默认</button>
        </div>
        <div class="action-group validation-action-group" aria-label="验证操作">
          <span>验证</span>
          <button id="previewButton" type="button" class="secondary" disabled>预览参数</button>
          <button id="validateButton" type="button" class="secondary" disabled>验证</button>
        </div>
        <div class="action-group launch-action-group" aria-label="启动操作">
          <label class="toggle">
            <input id="dryRunToggle" type="checkbox">
            <span>只安装不启动</span>
          </label>
          <button id="validateLaunchButton" type="button" class="secondary" disabled>验证后启动</button>
          <button id="launchButton" type="button" class="primary" disabled>启动</button>
        </div>
      </div>
    </header>

    <section class="summary-strip" aria-label="当前配置概览">
      <div class="summary-items">
        <div class="summary-item">
          <span>指挥官</span>
          <strong id="summaryCommander">-</strong>
        </div>
        <div class="summary-item">
          <span>地图</span>
          <strong id="summaryMap">-</strong>
        </div>
        <div class="summary-item">
          <span>精通</span>
          <strong id="summaryMastery">-</strong>
        </div>
        <div class="summary-item">
          <span>因子</span>
          <strong id="summaryMutators">0</strong>
        </div>
        <div class="summary-item">
          <span>模式</span>
          <strong id="summaryMode">启动</strong>
        </div>
        <div class="summary-item">
          <span>验证</span>
          <strong id="summaryValidation">未验证</strong>
        </div>
      </div>
      <button id="copySummaryButton" type="button" class="mini" disabled>复制摘要</button>
      <div id="configIssues" class="config-issues status-ok" aria-live="polite">配置可启动</div>
    </section>

    <main class="workspace">
      <section class="panel commander-panel" aria-labelledby="commanderTitle">
        <div class="panel-head">
          <h2 id="commanderTitle">指挥官</h2>
          <div class="mastery-head-actions">
            <span id="selectionSummary" class="badge">未就绪</span>
            <strong id="commanderQuickCount" class="badge">0</strong>
          </div>
        </div>

        <select id="commanderSelect" class="form-fallback-hidden" aria-hidden="true" tabindex="-1"></select>

        <div class="commander-gallery-block">
          <div class="quick-pick-head">
            <span>头像选择</span>
            <strong>两排优先显示</strong>
          </div>
          <div id="commanderQuickList" class="commander-gallery"></div>
        </div>
      </section>

      <section class="panel map-panel" aria-label="地图选择">
        <select id="mapSelect" class="form-fallback-hidden" aria-hidden="true" tabindex="-1"></select>
        <div id="mapQuickList" class="quick-pick-list map-quick-list map-gallery"></div>
      </section>

      <nav class="sheet-bar" role="tablist" aria-label="功能页切换">
        <button type="button" class="sheet-tab active" data-sheet-tab="mutators" aria-selected="true">因子</button>
        <button type="button" class="sheet-tab" data-sheet-tab="prestige" aria-selected="false">威望</button>
        <button type="button" class="sheet-tab" data-sheet-tab="bonuses" aria-selected="false">通用加成</button>
        <button type="button" class="sheet-tab" data-sheet-tab="output" aria-selected="false">输出</button>
      </nav>

      <div class="sheet-panels">
        <section class="panel mutator-panel sheet-panel" data-sheet-panel="mutators" aria-labelledby="mutatorTitle">
          <div class="panel-head">
            <h2 id="mutatorTitle">因子</h2>
            <span id="mutatorCount" class="badge">0</span>
          </div>
          <div class="mutator-tools">
            <label class="search">
              <span>搜索</span>
              <input id="mutatorSearch" type="search" autocomplete="off">
            </label>
            <label class="field">
              <span>显示</span>
              <select id="mutatorFilter">
                <option value="all">全部</option>
                <option value="selected">已选</option>
                <option value="unselected">未选</option>
              </select>
            </label>
            <label class="field">
              <span>类别</span>
              <select id="mutatorCategoryFilter">
                <option value="all">全部</option>
              </select>
            </label>
            <label class="field">
              <span>强度</span>
              <select id="mutatorTierFilter">
                <option value="all">全部</option>
              </select>
            </label>
            <label class="field preset-field">
              <span>Preset</span>
              <input id="mutatorPreset" type="number" min="0" max="3" value="0">
            </label>
            <label class="field random-field">
              <span>随机数</span>
              <input id="randomMutatorCount" type="number" min="1" max="10" value="3">
            </label>
            <button id="randomMutators" type="button" class="secondary">随机</button>
            <button id="appendRandomMutators" type="button" class="secondary">追加随机</button>
            <button id="randomMutators3" type="button" class="mini">3</button>
            <button id="randomMutators5" type="button" class="mini">5</button>
            <button id="randomMutators10" type="button" class="mini">10</button>
            <button id="copyMutatorIds" type="button" class="secondary" disabled>复制 ID</button>
            <button id="clearMutatorFilters" type="button" class="secondary">清除筛选</button>
            <button id="clearMutators" type="button" class="secondary">清空</button>
            <div id="mutatorPoolStatus" class="mutator-pool-status">随机池: 69</div>
          </div>
          <div class="selected-mutator-panel" aria-label="已选因子">
            <div class="selected-mutator-tools">
              <label class="search selected-mutator-search">
                <span>已选筛选</span>
                <input id="selectedMutatorSearch" type="search" autocomplete="off" placeholder="按名称或 ID">
              </label>
              <span id="selectedMutatorStatus" class="selected-mutator-status">未选择因子</span>
              <button id="clearMatchedMutators" type="button" class="mini" disabled>清除匹配</button>
              <button id="toggleSelectedMutators" type="button" class="mini" disabled>展开</button>
            </div>
            <div id="selectedMutators" class="selected-mutators collapsed" aria-live="polite"></div>
          </div>
          <div class="mutator-import-bar">
            <label class="field mutator-import-field">
              <span>粘贴因子 ID</span>
              <input id="mutatorImportText" type="text" autocomplete="off" placeholder="Barrier, Avenger, BlackFog">
            </label>
            <button id="applyMutatorImport" type="button" class="secondary">应用 ID</button>
            <button id="appendMutatorImport" type="button" class="secondary">追加 ID</button>
          </div>
          <div class="mutator-preset-bar">
            <label class="field preset-name-field">
              <span>组合名称</span>
              <input id="mutatorPresetName" type="text" maxlength="32" autocomplete="off" placeholder="例如：压力测试">
            </label>
            <label class="field preset-select-field">
              <span>已存组合</span>
              <select id="savedMutatorPreset"></select>
            </label>
            <button id="saveMutatorPreset" type="button" class="secondary">保存组合</button>
            <button id="applyMutatorPreset" type="button" class="secondary" disabled>套用</button>
            <button id="deleteMutatorPreset" type="button" class="secondary" disabled>删除</button>
          </div>
          <div id="mutatorGrid" class="mutator-grid"></div>
        </section>

        <section class="sheet-panel" data-sheet-panel="prestige" aria-labelledby="prestigeSheetTitle" hidden>
          <div class="right-stack">
          <section class="panel mastery-panel" aria-labelledby="prestigeSheetTitle">
            <div class="panel-head">
              <h2 id="prestigeSheetTitle">精通与威望</h2>
              <div class="mastery-head-actions">
                <span id="masteryPairStatus" class="badge">-</span>
                <span id="prestigeFusionStatus" class="badge">-</span>
              </div>
            </div>
            <div id="masteryGrid" class="mastery-grid"></div>
            <div id="prestigeList" class="prestige-list"></div>
            <div id="extraOptionList" class="extra-option-list"></div>
          </section>

          <section class="panel setup-panel" aria-labelledby="setupTitle">
            <div class="panel-head">
              <h2 id="setupTitle">配置</h2>
              <span id="commanderId" class="badge">-</span>
            </div>

            <div class="prestige-row">
              <label class="toggle">
                <input id="enablePrestiges" type="checkbox" checked>
                <span>启用融合威望</span>
              </label>
              <label class="toggle">
                <input id="enableMasteries" type="checkbox" checked>
                <span>启用精通</span>
              </label>
            </div>

            <div class="field-grid tight">
              <label class="field">
                <span>融合结果</span>
                <input id="prestigeMask" type="number" min="0" max="7" value="7" readonly>
              </label>
              <label class="field">
                <span>融合档案</span>
                <select id="prestigeProfile">
                  <option value="Prestige4" selected>威望4（全正向融合）</option>
                </select>
              </label>
              <label class="field">
                <span>精通默认等级</span>
                <input id="masteryLevel" type="number" value="15">
              </label>
            </div>

            <div class="scenario-block">
              <div class="scenario-head">
                <span>场景预设</span>
                <button id="clearScenarioPresets" type="button" class="mini">清除</button>
              </div>
              <div class="scenario-controls">
                <label class="field">
                  <span>方案名称</span>
                  <input id="scenarioPresetName" type="text" maxlength="36" autocomplete="off" placeholder="例如：凯瑞甘 + 黑死病">
                </label>
                <button id="saveScenarioPreset" type="button" class="secondary">保存场景</button>
              </div>
              <div id="scenarioPresets" class="scenario-list"></div>
            </div>

            <div class="recent-block">
              <div class="recent-head">
                <span>最近配置</span>
                <button id="clearRecentButton" type="button" class="mini">清除</button>
              </div>
              <div id="recentConfigs" class="recent-list"></div>
            </div>
          </section>
          </div>
        </section>

        <section class="sheet-panel" data-sheet-panel="bonuses" aria-labelledby="genericBonusTitle" hidden>
          <section class="panel generic-bonus-panel">
            <div class="panel-head">
              <h2 id="genericBonusTitle">通用加成</h2>
              <span class="badge">可选</span>
            </div>
            <div id="genericBonusList" class="generic-bonus-list"></div>
          </section>
        </section>
        <section class="sheet-panel" data-sheet-panel="output" aria-labelledby="outputTitle" hidden>
          <section class="panel output-panel">
            <div class="panel-head">
              <h2 id="outputTitle">输出</h2>
              <div class="output-actions">
                <button id="copyCommandButton" type="button" class="mini" disabled>复制命令</button>
                <button id="copyLogPathsButton" type="button" class="mini" disabled>复制日志路径</button>
                <button id="copyOutputButton" type="button" class="mini" disabled>复制输出</button>
                <button id="clearOutputButton" type="button" class="mini">清空输出</button>
                <span id="launchState" class="badge">空闲</span>
              </div>
            </div>
            <div class="config-io-block">
              <div class="config-io-head">
                <span>完整配置 JSON</span>
                <div class="config-io-actions">
                  <button id="exportPayloadButton" type="button" class="mini" disabled>导出当前</button>
                  <button id="copyPayloadButton" type="button" class="mini" disabled>复制 JSON</button>
                  <button id="applyPayloadButton" type="button" class="mini" disabled>应用 JSON</button>
                  <button id="clearPayloadButton" type="button" class="mini">清空</button>
                </div>
              </div>
              <textarea id="payloadText" class="payload-text" spellcheck="false" placeholder="粘贴 buildLaunchPayload JSON，可从文档或日志回灌"></textarea>
              <div id="payloadStatus" class="payload-status">等待配置</div>
            </div>
            <div class="log-path-strip" aria-label="当前日志路径">
              <span id="stdoutPathText">stdout: -</span>
              <span id="stderrPathText">stderr: -</span>
            </div>
            <pre id="outputLog" class="output-log">等待操作</pre>
            <div class="history-block">
              <div class="history-head">
                <span>启动历史</span>
                <button id="clearLaunchHistory" type="button" class="mini">清除</button>
              </div>
              <div id="launchHistory" class="history-list"></div>
            </div>
          </section>
        </section>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
